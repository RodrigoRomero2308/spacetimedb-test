name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
      - cursor/spacetimedb-juego-multijugador-e715
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Maincloud por defecto. Configura secrets VITE_SPACETIMEDB_URI y VITE_SPACETIMEDB_DB para sobrescribir.
          VITE_SPACETIMEDB_URI: https://maincloud.spacetimedb.com
          VITE_SPACETIMEDB_DB: juego-multijugador

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
